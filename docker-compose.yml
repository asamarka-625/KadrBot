services:
  backend:
    build: kvspb_time_ticket/
    volumes:
      - ./data:/app/data/database/
      - ./kvspb_time_ticket/staticfiles/:/app/staticfiles/
    restart: unless-stopped

  max_bot:
    # extra_hosts:
    #  - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.max_bot
      # network: host
      # args:
      #  - http_proxy=http://127.0.0.1:10808
      #  - https_proxy=http://127.0.0.1:10808
    depends_on:
      - backend
    volumes:
      - ./logs/:/app/logs/
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./kvspb_time_ticket/staticfiles/:/app/static:ro
    depends_on:
      - backend
    restart: unless-stopped

